name: tpl-mandrel-dev-packages
description: Mandrel development packages
parent: tpl-minimal

packages:
  # Native image / substratevm build dependencies
  - gcc
  - gcc-c++
  - make
  - glibc-devel
  - zlib-devel
  - glibc-static
  - zlib-static
  - libstdc++-static
  - libffi-devel
  # Assorted build helpers mx shells out to
  - patch
  - unzip
  - zip
  - file
  - diffutils

  # Developer tools
  - awk
  - gawk
  - emacs-nox
  - gdb
  - strace
  - ripgrep
  - jq
  - htop
  - lsof
  - graphviz
  - sqlite
  - git-lfs
  - bash-completion
  - rsync
  - wget
  - zip
  - unzip
  - openssh-clients
  - nftables
  - diffutils
  - hostname
  - time
  - java-25-openjdk-devel
  - java-25-openjdk-javadoc
  - java-25-openjdk-src
  - python3-pip
  - uv

env:
  - name: JAVA_HOME
    value: /usr/lib/jvm/java-25-openjdk

tools:
  - claude
  - pi
  - gh
  - bob
  - codex
  - copilot
  - tmux
  - starship
  - podman
  - opencode
  - maven-3
