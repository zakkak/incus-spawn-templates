name: tpl-mandrel-dev
description: Mandrel development
parent: tpl-mandrel-dev-packages

host-resources:
  - source: ~/.agents
    mode: readonly
  # - source: ~/.claude/skills/
  #   mode: readonly
  - source: ~/.claude/CLAUDE.md
    mode: readonly
  - source: ~/.claude/plugins/
    mode: readonly
  - source: ~/.emacs.d/init.el
    mode: readonly
  - source: ~/.tmux.conf
    mode: readonly

workdir: ~/

tools:
  - vscode-remote
  - sshd
  - mise

repos:
  - host-source: ~/code/incus-spawn
    path: ~/incus-spawn
  - host-source: ~/code/quarkus
    path: ~/quarkus
  - host-source: ~/code/mx
    path: ~/mx
  - host-source: ~/code/mandrel
    path: ~/mandrel
  - host-source: ~/code/mandrel-packaging
    path: ~/mandrel-packaging
  - host-source: ~/code/mandrel-integration-tests
    path: ~/mandrel-integration-tests
