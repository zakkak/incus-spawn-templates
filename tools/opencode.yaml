name: opencode
description: Open source AI coding agent (opencode.ai)
packages:
  - nodejs
  - sqlite
parameters:
  model:
    type: string
    description: "Model identifier (format: provider/model, e.g. anthropic/claude-opus-4-6)"
    optional: true
    reconfigurable: true
  small-model:
    type: string
    description: "Model for lightweight tasks such as title generation (format: provider/model)"
    optional: true
    reconfigurable: true
run:
  - npm install -g @opencode/cli@latest
  # Workaround for https://github.com/Sanne/incus-spawn/issues/749
  # host-resource copy creates ~/.config/opencode/ as root
  - |
    mkdir -p /home/agentuser/.config/opencode
    chown agentuser:agentuser /home/agentuser/.config/opencode
run_as_user:
  - |
    node - '${param_model}' '${param_small-model}' <<'NODE'
    const fs = require("fs");
    const path = require("path");

    const [model, smallModel] = process.argv.slice(2)
      .filter((value) => value && !value.startsWith("${param_"));

    const config = { "$schema": "https://opencode.ai/config.json" };
    if (model) config.model = model;
    if (smallModel) config.agents = { title: { model: smallModel } };

    const dir = path.join(process.env.HOME, ".config", "opencode");
    fs.mkdirSync(dir, { recursive: true });
    fs.writeFileSync(path.join(dir, "opencode.json"), `${JSON.stringify(config, null, 2)}\n`);
    NODE
files:
  - path: /etc/opencode/opencode.json
    content: |
      {
        "$schema": "https://opencode.ai/config.json",
        "update": "disable",
        "share": "disabled",
        "provider": {
          "anthropic": {
            "options": {
              "apiKey": "{env:ANTHROPIC_API_KEY}"
            }
          }
        }
      }
env:
  - name: ANTHROPIC_API_KEY
    value: sk-ant-placeholder
    strategy: set-if-unset
verify: opencode --version
actions:
  - label: "OpenCode"
    type: shell
    command: >-
      d=$(sqlite3 -noheader ~/.local/share/opencode/opencode.db
      "SELECT directory FROM session_v2 ORDER BY time_updated DESC LIMIT 1" 2>/dev/null);
      if [ -z "$d" ]; then
      d=$(sqlite3 -noheader ~/.local/share/opencode/opencode.db
      "SELECT directory FROM session ORDER BY time_updated DESC LIMIT 1" 2>/dev/null); fi;
      if [ -n "$d" ] && [ -d "$d" ]; then cd "$d";
      opencode --continue || opencode; else opencode; fi
    auto_return: true
